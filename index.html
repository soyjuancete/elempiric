<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeView Clone</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lightweight Charts via CDN -->
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

    <!-- Lucide Icons via CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0e11',
                        darkPanel: '#181a20',
                        darkBorder: '#2b3139',
                        upColor: '#0ecb81',
                        downColor: '#f6465d',
                        accentBlue: '#fcd535',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0e11;
            color: #eaecef;
            margin: 0;
            overflow: hidden; /* Prevent body scroll */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .tv-layout {
            display: grid;
            grid-template-columns: 50px 1fr 300px;
            grid-template-rows: 60px 1fr;
            height: 100vh;
        }

        .tv-header {
            grid-column: 1 / -1;
            background-color: #181a20;
            border-bottom: 1px solid #2b3139;
        }

        .tv-sidebar {
            background-color: #181a20;
            border-right: 1px solid #2b3139;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 1rem;
            gap: 1.5rem;
        }

        .tv-main {
            display: flex;
            flex-direction: column;
            background-color: #131722; /* Slightly different dark for chart area */
            position: relative;
        }

        .tv-right-panel {
            background-color: #181a20;
            border-left: 1px solid #2b3139;
            padding: 1rem;
            overflow-y: auto;
        }

        /* Custom Scrollbar for Right Panel */
        .tv-right-panel::-webkit-scrollbar {
            width: 4px;
        }
        .tv-right-panel::-webkit-scrollbar-thumb {
            background-color: #2b3139;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="tv-layout">
    <!-- Header -->
    <header class="tv-header flex items-center justify-between px-4">
        <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-2">
                <i data-lucide="line-chart" class="w-6 h-6 text-accentBlue"></i>
                <span class="font-bold text-lg tracking-tight">TradeView <span class="text-xs text-gray-500 font-normal">Clone</span></span>
            </div>

            <div class="hidden md:flex items-center space-x-4 text-sm font-medium">
                <button id="btn-btc" class="hover:text-accentBlue transition-colors">BTCUSDT</button>
                <button id="btn-eth" class="text-gray-400 hover:text-accentBlue transition-colors">ETHUSDT</button>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <div class="relative hidden sm:block">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                <input type="text" placeholder="Search..." class="bg-[#2b3139] text-sm text-white rounded-md pl-9 pr-4 py-1.5 focus:outline-none focus:ring-1 focus:ring-accentBlue w-48 border border-transparent focus:border-accentBlue transition-all">
            </div>
            <i data-lucide="bell" class="w-5 h-5 text-gray-400 cursor-pointer hover:text-white transition-colors"></i>
            <i data-lucide="settings" class="w-5 h-5 text-gray-400 cursor-pointer hover:text-white transition-colors"></i>
            <div class="w-8 h-8 rounded-full bg-accentBlue text-darkBg flex items-center justify-center font-bold text-sm cursor-pointer">
                JD
            </div>
        </div>
    </header>

    <!-- Left Sidebar (Tools) -->
    <aside class="tv-sidebar">
        <i data-lucide="mouse-pointer-2" class="w-5 h-5 text-accentBlue cursor-pointer"></i>
        <i data-lucide="crosshair" class="w-5 h-5 text-gray-400 cursor-pointer hover:text-white transition-colors"></i>
        <i data-lucide="pen-tool" class="w-5 h-5 text-gray-400 cursor-pointer hover:text-white transition-colors"></i>
        <i data-lucide="bar-chart-2" class="w-5 h-5 text-gray-400 cursor-pointer hover:text-white transition-colors"></i>
        <div class="flex-grow"></div>
        <i data-lucide="trash-2" class="w-5 h-5 text-gray-400 cursor-pointer hover:text-white transition-colors mb-4"></i>
    </aside>

    <!-- Main Chart Area -->
    <main class="tv-main">
        <!-- Chart Overlays (Price, Symbol) -->
        <div class="absolute top-4 left-4 z-10 pointer-events-none">
            <div class="flex items-baseline space-x-3 mb-1">
                <h2 id="chart-symbol" class="text-2xl font-bold text-white tracking-wider">BTCUSDT</h2>
                <span class="text-gray-400 font-medium">1D</span>
                <span class="text-gray-400 font-medium">Binance</span>
            </div>
            <div id="chart-price-info" class="flex items-center space-x-3 text-sm font-mono text-gray-300">
                <span>O<span class="text-white ml-1">--</span></span>
                <span>H<span class="text-white ml-1">--</span></span>
                <span>L<span class="text-white ml-1">--</span></span>
                <span>C<span class="text-white ml-1">--</span></span>
            </div>

            <div class="flex items-center space-x-2 mt-4 text-xs font-medium pointer-events-auto">
                <div class="flex items-center space-x-1 text-[#2962FF]">
                    <i data-lucide="eye" class="w-3.5 h-3.5 cursor-pointer"></i>
                    <span>SMA 20</span>
                </div>
            </div>
        </div>

        <div id="chart-container" class="flex-grow w-full h-full"></div>
    </main>

    <!-- Right Panel (Watchlist) -->
    <aside class="tv-right-panel">
        <div class="flex items-center justify-between mb-4 pb-2 border-b border-darkBorder">
            <h3 class="font-bold text-white uppercase text-sm tracking-wider">Watchlist</h3>
            <i data-lucide="plus" class="w-4 h-4 text-gray-400 cursor-pointer hover:text-white"></i>
        </div>

        <div class="space-y-3">
            <div class="flex justify-between items-center group cursor-pointer">
                <div>
                    <div class="font-bold text-white group-hover:text-accentBlue transition-colors">BTCUSDT</div>
                    <div class="text-xs text-gray-500">Bitcoin</div>
                </div>
                <div class="text-right">
                    <div class="font-mono text-white text-sm" id="wl-btc-price">--</div>
                    <div class="text-xs text-upColor font-medium">+1.24%</div>
                </div>
            </div>

            <div class="flex justify-between items-center group cursor-pointer">
                <div>
                    <div class="font-bold text-white group-hover:text-accentBlue transition-colors">ETHUSDT</div>
                    <div class="text-xs text-gray-500">Ethereum</div>
                </div>
                <div class="text-right">
                    <div class="font-mono text-white text-sm" id="wl-eth-price">--</div>
                    <div class="text-xs text-upColor font-medium">+2.15%</div>
                </div>
            </div>

            <div class="flex justify-between items-center group cursor-pointer mt-4 pt-4 border-t border-darkBorder">
                <div>
                    <div class="font-bold text-white group-hover:text-accentBlue transition-colors">AAPL</div>
                    <div class="text-xs text-gray-500">Apple Inc.</div>
                </div>
                <div class="text-right">
                    <div class="font-mono text-white text-sm">185.92</div>
                    <div class="text-xs text-downColor font-medium">-0.45%</div>
                </div>
            </div>

            <div class="flex justify-between items-center group cursor-pointer">
                <div>
                    <div class="font-bold text-white group-hover:text-accentBlue transition-colors">YPF.BA</div>
                    <div class="text-xs text-gray-500">YPF S.A.</div>
                </div>
                <div class="text-right">
                    <div class="font-mono text-white text-sm">24500</div>
                    <div class="text-xs text-upColor font-medium">+3.20%</div>
                </div>
            </div>
        </div>
    </aside>
</div>

<script>

    // Initialize Lucide Icons
    setTimeout(() => lucide.createIcons(), 100);

    // Chart Setup
    window.addEventListener('DOMContentLoaded', () => {
        const chartContainer = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: {
                background: { type: 'solid', color: '#131722' },
                textColor: '#D1D4DC',
            },
            grid: {
                vertLines: { color: '#2B3139' },
                horzLines: { color: '#2B3139' },
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
            },
            rightPriceScale: {
                borderColor: '#2B3139',
            },
            timeScale: {
                borderColor: '#2B3139',
                timeVisible: true,
            },
        });

        const candleSeries = chart.addCandlestickSeries({
            upColor: '#26A69A',
            downColor: '#EF5350',
            borderDownColor: '#EF5350',
            borderUpColor: '#26A69A',
            wickDownColor: '#EF5350',
            wickUpColor: '#26A69A',
        });

        const smaSeries = chart.addLineSeries({
            color: '#2962FF',
            lineWidth: 2,
            title: 'SMA 20',
        });

        // Handle Resize
        new ResizeObserver(entries => {
            if (entries.length === 0 || entries[0].target !== chartContainer) { return; }
            const newRect = entries[0].contentRect;
            chart.applyOptions({ height: newRect.height, width: newRect.width });
        }).observe(chartContainer);

        // Update Price Info on Crosshair Move
        const ohlcEl = document.getElementById('chart-price-info');
        chart.subscribeCrosshairMove((param) => {
            if (param.time && param.seriesData.size > 0) {
                const data = param.seriesData.get(candleSeries);
                if (data) {
                    ohlcEl.innerHTML = `
                        <span>O<span class="text-white ml-1">${data.open.toFixed(2)}</span></span>
                        <span>H<span class="text-white ml-1">${data.high.toFixed(2)}</span></span>
                        <span>L<span class="text-white ml-1">${data.low.toFixed(2)}</span></span>
                        <span>C<span class="text-white ml-1">${data.close.toFixed(2)}</span></span>
                    `;
                }
            }
        });

        // Generate Mock Data (Fallback)
        function generateMockData(count = 100) {
            const data = [];
            let time = Math.floor(Date.now() / 1000) - (count * 86400);
            let open = 50000;
            let high, low, close;

            for (let i = 0; i < count; i++) {
                close = open + (Math.random() - 0.5) * 1000;
                high = Math.max(open, close) + Math.random() * 500;
                low = Math.min(open, close) - Math.random() * 500;
                data.push({ time: time, open: open, high: high, low: low, close: close });
                open = close;
                time += 86400; // 1 day in seconds
            }
            return data;
        }

        // Calculate SMA
        function calculateSMA(data, period) {
            const sma = [];
            for (let i = period - 1; i < data.length; i++) {
                let sum = 0;
                for (let j = 0; j < period; j++) {
                    sum += data[i - j].close;
                }
                sma.push({ time: data[i].time, value: sum / period });
            }
            return sma;
        }

        // Fetch Data from Binance
        async function loadData(symbol) {
            document.getElementById('chart-symbol').textContent = symbol;
            let candleData = [];

            try {
                // Fetch daily klines (candlesticks)
                const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1d&limit=150`);
                if (response.status === 451 || (await response.clone().json()).code === 0) {
                    throw new Error("Binance API restricted location");
                }
                if (!response.ok) throw new Error("Network error");
                const json = await response.json();

                candleData = json.map(d => ({
                    time: d[0] / 1000,
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4])
                }));

                // Sort by time
                candleData.sort((a, b) => a.time - b.time);

                // Update watchlist mock prices with latest close
                if(symbol === 'BTCUSDT' && candleData.length > 0) {
                   document.getElementById('wl-btc-price').textContent = candleData[candleData.length-1].close.toFixed(2);
                }
                if(symbol === 'ETHUSDT' && candleData.length > 0) {
                   document.getElementById('wl-eth-price').textContent = candleData[candleData.length-1].close.toFixed(2);
                }

            } catch (error) {
                console.warn("Failed to fetch from Binance, using mock data.", error);
                candleData = generateMockData(150);
                candleData.sort((a, b) => a.time - b.time);
                // Also update mock prices
                if(symbol === 'BTCUSDT') document.getElementById('wl-btc-price').textContent = candleData[candleData.length-1].close.toFixed(2);
                if(symbol === 'ETHUSDT') document.getElementById('wl-eth-price').textContent = candleData[candleData.length-1].close.toFixed(2);
            }

            // Set Data
            candleSeries.setData(candleData);

            // Set SMA
            const smaData = calculateSMA(candleData, 20);
            smaSeries.setData(smaData);

            // Fit Content
            chart.timeScale().fitContent();
        }

        // Button Listeners
        document.getElementById('btn-btc').addEventListener('click', (e) => {
            e.target.classList.remove('text-gray-400');
            document.getElementById('btn-eth').classList.add('text-gray-400');
            loadData('BTCUSDT');
        });

        document.getElementById('btn-eth').addEventListener('click', (e) => {
            e.target.classList.remove('text-gray-400');
            document.getElementById('btn-btc').classList.add('text-gray-400');
            loadData('ETHUSDT');
        });

        // Watchlist Listeners
        const watchlistItems = document.querySelectorAll('.tv-right-panel .group');
        watchlistItems.forEach(item => {
            item.addEventListener('click', () => {
                const symbol = item.querySelector('.font-bold').textContent;
                // If it's crypto, we try to load it normally.
                // If it's a stock, the Binance API will fail (400 or network error) and it will gracefully fallback to our mock data generator.
                loadData(symbol);

                // Reset header buttons if we click a non-crypto symbol
                if (symbol !== 'BTCUSDT' && symbol !== 'ETHUSDT') {
                    document.getElementById('btn-btc').classList.add('text-gray-400');
                    document.getElementById('btn-eth').classList.add('text-gray-400');
                } else if (symbol === 'BTCUSDT') {
                    document.getElementById('btn-btc').classList.remove('text-gray-400');
                    document.getElementById('btn-eth').classList.add('text-gray-400');
                } else if (symbol === 'ETHUSDT') {
                    document.getElementById('btn-eth').classList.remove('text-gray-400');
                    document.getElementById('btn-btc').classList.add('text-gray-400');
                }
            });
        });

        // Initial Load
        const forceResize = () => {
           if(chartContainer.clientWidth > 0 && chartContainer.clientHeight > 0) {
              chart.applyOptions({ height: chartContainer.clientHeight, width: chartContainer.clientWidth });
              loadData('BTCUSDT');
           } else {
              setTimeout(forceResize, 100);
           }
        };
        forceResize();
    });

</script>
</body>
</html>
